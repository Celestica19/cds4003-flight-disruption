<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img" aria-labelledby="title desc"><title id="title">Repository folder correction</title><desc id="desc">Upload the contents of the old nested project to the root, verify the new files, then delete the old enclosing folder.</desc><rect width="1160" height="670" rx="20" fill="#f4f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17324d}.head{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#536579}.code{font-family:DejaVu Sans Mono,monospace;font-size:18px}.small{font-size:16px}.tag{font-size:14px;font-weight:700}</style><text x="34" y="48" class="head">Correct the location, then remove the duplicate</text><text x="34" y="78" class="sub">Folder-layout schematic • not a screenshot of the current repository</text><rect x="30" y="107" width="530" height="430" rx="14" fill="#fff" stroke="#e6b7a8"/><rect x="600" y="107" width="530" height="430" rx="14" fill="#fff" stroke="#8fbfae"/><text x="53" y="146" class="tag" fill="#92452c">EARLIER UPLOAD</text><text x="623" y="146" class="tag" fill="#1d6c54">INTENDED ROOT LAYOUT</text><text x="53" y="185" class="code">cds4003-flight-disruption/</text><text x="78" y="228" class="code">CDS4003_GitHub/</text><text x="104" y="270" class="code">README.md</text><text x="104" y="307" class="code">requirements.txt</text><text x="104" y="344" class="code">app/streamlit_app.py</text><text x="104" y="381" class="code">src/</text><text x="104" y="418" class="code">models/</text><text x="53" y="488" class="small">An extra folder surrounds the project.</text><text x="623" y="185" class="code">cds4003-flight-disruption/</text><text x="648" y="228" class="code">README.md</text><text x="648" y="265" class="code">requirements.txt</text><text x="648" y="302" class="code">app/streamlit_app.py</text><text x="648" y="339" class="code">src/</text><text x="648" y="376" class="code">models/</text><text x="648" y="413" class="code">docs/ · reports/ · notebooks/</text><text x="623" y="488" class="small">Open the repository and see these directly.</text><rect x="30" y="560" width="1100" height="80" rx="12" fill="#11324d"/><text x="52" y="592" style="fill:white;font-size:18px;font-weight:700">1  Upload contents at root       2  Verify files and README       3  Delete old folder</text><text x="52" y="619" style="fill:#d3e3f0;font-size:15px">Remove only the obsolete enclosing directory after the new root version is confirmed.</text></svg>